# Publishes the version that zoteroapi.lua names ("fork v0.13") as a GitHub
# release, with the plugin's folder as zoteroatelier.koplugin.zip attached:
# the file the plugin's updater (zotero_update.lua) looks for.
#
# Runs when main changes the version (or this workflow), when a tag v… is
# pushed, or by hand (Actions > Release > Run workflow). A version that has a
# release already is left alone, so bumping the version in zoteroapi.lua and
# pushing to main is all a release takes.
name: Release

on:
  push:
    branches: [main]
    paths: ["zoteroapi.lua", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: version
        run: |
          version="$(grep -o 'fork v[0-9][0-9.]*' zoteroapi.lua | head -1 | sed 's/^fork v//')"
          if [ -z "$version" ]; then echo "::error::No version (fork v…) found in zoteroapi.lua"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but zoteroapi.lua says v$version"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version has a release already: nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Every Lua file must compile
        if: steps.version.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit > /dev/null
          cat > "$RUNNER_TEMP/compile.lua" <<'EOF'
          -- every file named on the command line must compile (none is run)
          for i = 1, #arg do
            local chunk, err = loadfile(arg[i])
            if not chunk then
              print("::error file=" .. arg[i] .. "::" .. tostring(err))
              os.exit(1)
            end
          end
          print(#arg .. " Lua files compile")
          EOF
          luajit "$RUNNER_TEMP/compile.lua" *.lua

      - name: Package the plugin's folder
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p dist/zoteroatelier.koplugin
          cp *.lua LICENSE FORK_NOTES.md dist/zoteroatelier.koplugin/
          (cd dist && zip -q -r zoteroatelier.koplugin.zip zoteroatelier.koplugin)
          unzip -l dist/zoteroatelier.koplugin.zip

      - name: Release notes from FORK_NOTES.md
        if: steps.version.outputs.exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          awk -v v="## $tag" '
            ($0 == v || index($0, v " ") == 1) { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' FORK_NOTES.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "$tag" > notes.md; fi
          cat notes.md

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="$(grep -m1 "^## $tag" FORK_NOTES.md | sed 's/^## //')"
          gh release create "$tag" dist/zoteroatelier.koplugin.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${title:-$tag}" --notes-file notes.md
